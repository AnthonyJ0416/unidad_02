#String de conexion a la base de datos
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
#Tipo de base de datos
quarkus.datasource.db-kind=postgresql
#Usuario de la base de datos
quarkus.datasource.username=postgres
#Contraseña db
quarkus.datasource.password=admin123
#mostrar las sentencias SQL en la consola
quarkus.hibernate-orm.log.sql=true
#gestion de la base de  datos, todo lo que haya creado en mi base de datos la va a eliminar
quarkus.hibernate-orm.database.generation=drop-and-create
